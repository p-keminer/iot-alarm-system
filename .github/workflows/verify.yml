name: Verify

on:
  push:
  pull_request:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  firmware:
    name: Firmware builds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ESP8266_INDEX_URL: https://arduino.esp8266.com/stable/package_esp8266com_index.json
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Arduino CLI 1.5.1
        uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.5.1

      - name: Isolate Arduino state from the repository
        shell: bash
        run: |
          set -euo pipefail
          printf 'ARDUINO_DIRECTORIES_DATA=%s/arduino/data\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'ARDUINO_DIRECTORIES_DOWNLOADS=%s/arduino/downloads\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'ARDUINO_DIRECTORIES_USER=%s/arduino/user\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Install pinned cores
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli core update-index --additional-urls "$ESP8266_INDEX_URL"
          arduino-cli core install arduino:avr@1.8.8
          arduino-cli core install esp8266:esp8266@3.1.2 \
            --additional-urls "$ESP8266_INDEX_URL"

      - name: Install pinned libraries
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli lib install --no-deps ArduinoJson@7.4.3
          arduino-cli lib install --no-deps WiFiManager@2.0.17
          arduino-cli lib install --no-deps NetApiHelpers@1.0.3
          arduino-cli lib install --no-deps TelnetStream@1.3.0
          arduino-cli lib install --no-deps MFRC522@1.4.12

      - name: Compile all firmware variants
        shell: bash
        run: bash tests/ci/compile_firmware.sh

      - name: Confirm tests left no repository artifacts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"

  software-and-docs:
    name: Runtime, web, and documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install pinned test dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          pyserial==3.5 yamllint==1.37.1

      - name: Validate workflow YAML
        run: yamllint --strict -c tests/ci/yamllint-actions.yml .github/workflows

      - name: Run Python runtime and deployment tests
        run: >-
          python -m unittest discover -v
          -s tests/runtime_deploy -p 'test_*.py'

      - name: Run host firmware safety tests
        shell: bash
        run: bash tests/ci/run_host_firmware_tests.sh

      - name: Lint PHP and run security protocol tests
        shell: bash
        run: bash tests/ci/check_php.sh

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -path ./.git -prune -o -type f -name '*.js' -print0)

      - name: Check local Markdown links and anchors
        run: python tests/ci/check_markdown_links.py

      - name: Confirm tests left no repository artifacts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"
