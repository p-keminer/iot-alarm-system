# ============================================================
# Fail2ban Jail: iot-login
# Ueberwacht PHP-FPM error_log auf FAIL_LOGIN-Eintraege aus login.php
# und sperrt Angreifer-IPs per iptables auf OS-Ebene.
#
# Voraussetzung: php_admin_value[error_log] = /var/log/fpm-php.www.log
#                in /etc/php/8.4/fpm/pool.d/www.conf aktiviert
# ============================================================

[iot-login]

# Jail aktiviert
enabled  = true

# Verweist auf /etc/fail2ban/filter.d/iot-login.conf
filter   = iot-login

# PHP-FPM Pool-Logdatei (nicht Apache!)
logpath  = /var/log/fpm-php.www.log

# 10 Fehlversuche in 10 Minuten = 1 Stunde gesperrt
maxretry = 10
findtime = 600
bantime  = 3600

# Nur Loopback ausnehmen. Das gesamte LAN auszunehmen wuerde kompromittierte
# Clients und absichtliche Fehlversuche ungebremst lassen.
ignoreip = 127.0.0.1/8 ::1
