# ============================================================
# Fail2ban Filter: iot-login
# Ziel-Log: /var/log/fpm-php.www.log (PHP-FPM error_log Output)
# ============================================================
# Erkennt fehlgeschlagene Login-Versuche aus login.php,
# die per error_log() in die PHP-FPM Pool-Logdatei geschrieben werden.
#
# Beispiel-Logzeile:
# [27-Feb-2026 14:23:01 UTC] FAIL_LOGIN from 192.0.2.99
# [27-Feb-2026 14:23:01 UTC] FAIL_LOGIN from 192.0.2.99 (geblockt, Tier 2)
#
# WICHTIG: Kein Apache auf diesem System!
# PHP-FPM schreibt via php_admin_value[error_log] in pool.d/www.conf
# ============================================================

[Definition]

# failregex: Regulaerer Ausdruck zum Erkennen eines Fehlversuchs.
# <HOST> ist der Fail2ban-Platzhalter fuer IPv4/IPv6
# WICHTIG: Kein Zeitstempel im Regex! Fail2ban strippt den Timestamp
# automatisch (Datumserkennung laeuft separat via datepattern).
# Nach dem Strip bleibt '] FAIL_LOGIN from <IP>' - wir matchen nur
# den relevanten Teil. Matcht sowohl normale als auch geblockte IPs.
failregex = ^\s*(?:\[\s*\]\s*)?(?:PHP message:\s+)?FAIL_LOGIN from <HOST>(?: \(geblockt, Tier [0-9]+\))?\s*$

# ignoreregex: Zeilen die ignoriert werden sollen
ignoreregex =
