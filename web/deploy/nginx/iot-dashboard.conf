# IoT alarm dashboard - nginx + PHP-FPM production template
#
# This is the only web-server topology used by the project:
#   * port 80: canonical redirect to HTTPS
#   * port 443: dashboard and authenticated camera proxy
#   * <API_PORT>: LAN-only ESP API (HTTP is required by the deployed nodes)
#
# Replace every <...> placeholder before enabling the site. Do not run a
# second web server in parallel. Validate with `nginx -t` before reloading.


# HTTP never serves files. A fixed target avoids Host-header redirect attacks.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 308 https://<PI_IP_OR_HOSTNAME>$request_uri;
}


# Browser dashboard
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name <PI_IP_OR_HOSTNAME>;

    root /var/www/html;
    index index.php;
    autoindex off;
    client_max_body_size 2m;

    ssl_certificate     /etc/ssl/certs/iot-dashboard.crt;
    ssl_certificate_key /etc/ssl/private/iot-dashboard.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Runtime state, credentials, logs and internal PHP modules must never be
    # delivered as static files. Exact matches also cover requests without a
    # trailing slash. The ^~ prefixes win over the static-file regex below.
    location = /data { return 404; }
    location ^~ /data/ { return 404; }
    location = /includes { return 404; }
    location ^~ /includes/ { return 404; }
    location = /views { return 404; }
    location ^~ /views/ { return 404; }
    location = /deploy { return 404; }
    location ^~ /deploy/ { return 404; }
    location = /screenshots { return 404; }
    location ^~ /screenshots/ { return 404; }

    location ~ (^|/)\. { return 404; }
    location ~* \.(?:bak|cfg|conf|env|example|ini|log|md|py|service|sh|sql)$ {
        return 404;
    }

    # The camera service stays bound to loopback. Browser credentials are
    # exchanged only with this HTTPS endpoint.
    location /cam/ {
        auth_basic           "IoT Camera";
        auth_basic_user_file /etc/nginx/.htpasswd-cam;
        proxy_pass           http://127.0.0.1:<CAM_PORT>/;
        proxy_set_header     Host $host;
        proxy_set_header     X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout   30s;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
    }

    location ~* \.(?:css|gif|ico|jpe?g|js|png|svg|woff2?)$ {
        try_files $uri =404;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}


# ESP API. Bind <PI_LAN_IP> to the Raspberry Pi's trusted LAN address and set
# <TRUSTED_LAN_CIDR> narrowly (for example the isolated IoT VLAN). This port is
# intentionally not reachable from WAN, guest Wi-Fi or localhost proxies.
server {
    listen <PI_LAN_IP>:<API_PORT>;
    server_name _;

    root /var/www/html;
    autoindex off;
    client_max_body_size 64k;

    allow <TRUSTED_LAN_CIDR>;
    deny all;

    location = /api.php {
        limit_except GET POST { deny all; }
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/html/api.php;
        fastcgi_param HTTPS off;
    }

    # Explicitly deny runtime data and every non-API path on this listener.
    location = /data { return 404; }
    location ^~ /data/ { return 404; }
    location / { return 404; }
}
